<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- Sky gradient: deep night purple to dark blue -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0015"/>
      <stop offset="40%" style="stop-color:#1a0a3d"/>
      <stop offset="70%" style="stop-color:#2d1b5e"/>
      <stop offset="100%" style="stop-color:#1a0a3d"/>
    </linearGradient>
    <!-- Ground gradient -->
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0520"/>
      <stop offset="100%" style="stop-color:#050010"/>
    </linearGradient>
    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7b5ea7;stop-opacity:0"/>
    </radialGradient>
    <!-- Horizon glow -->
    <radialGradient id="horizonGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" style="stop-color:#7b2d8b;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#0a0015;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="300" fill="url(#sky)"/>
  <!-- Horizon glow -->
  <rect width="1200" height="300" fill="url(#horizonGlow)"/>

  <!-- Stars scattered -->
  <g fill="white" opacity="0.9">
    <circle cx="50" cy="20" r="1"/><circle cx="120" cy="45" r="1.2"/><circle cx="200" cy="15" r="0.8"/>
    <circle cx="310" cy="35" r="1"/><circle cx="380" cy="10" r="1.3"/><circle cx="450" cy="50" r="0.9"/>
    <circle cx="530" cy="25" r="1.1"/><circle cx="620" cy="18" r="0.8"/><circle cx="700" cy="40" r="1.2"/>
    <circle cx="770" cy="12" r="1"/><circle cx="850" cy="30" r="1.4"/><circle cx="920" cy="22" r="0.9"/>
    <circle cx="1000" cy="15" r="1.1"/><circle cx="1080" cy="38" r="1"/><circle cx="1150" cy="8" r="1.3"/>
    <circle cx="80" cy="60" r="0.8"/><circle cx="160" cy="75" r="1"/><circle cx="260" cy="55" r="0.9"/>
    <circle cx="420" cy="70" r="1.1"/><circle cx="580" cy="60" r="0.8"/><circle cx="660" cy="78" r="1"/>
    <circle cx="740" cy="55" r="1.2"/><circle cx="880" cy="65" r="0.9"/><circle cx="960" cy="50" r="1"/>
    <circle cx="1050" cy="72" r="1.1"/><circle cx="1130" cy="58" r="0.8"/><circle cx="1180" cy="40" r="1"/>
    <circle cx="30" cy="85" r="1"/><circle cx="145" cy="90" r="0.8"/><circle cx="340" cy="80" r="1.2"/>
    <circle cx="500" cy="85" r="0.9"/><circle cx="720" cy="90" r="1"/><circle cx="1010" cy="88" r="1.1"/>
  </g>

  <!-- Moon -->
  <circle cx="960" cy="65" r="45" fill="url(#moonGlow)"/>
  <circle cx="960" cy="65" r="28" fill="#f5f0e8" filter="url(#glow)"/>
  <circle cx="948" cy="58" r="22" fill="#1a0a3d"/>

  <!-- Distant mountains (back layer) -->
  <polygon points="0,220 80,140 160,180 240,120 320,160 400,100 480,145 560,110 640,150 720,105 800,140 880,115 960,145 1040,110 1120,135 1200,120 1200,300 0,300" fill="#1a0a3d" opacity="0.8"/>
  <!-- Mountain highlights -->
  <polygon points="380,100 400,100 420,115" fill="#2d1b5e" opacity="0.6"/>
  <polygon points="700,105 720,105 740,118" fill="#2d1b5e" opacity="0.6"/>
  <polygon points="1020,110 1040,110 1060,122" fill="#2d1b5e" opacity="0.6"/>

  <!-- Mid mountains -->
  <polygon points="0,240 100,175 200,205 300,160 400,190 500,155 600,185 700,158 800,182 900,162 1000,180 1100,165 1200,178 1200,300 0,300" fill="#130830" opacity="0.9"/>

  <!-- Ground / hill base -->
  <rect x="0" y="260" width="1200" height="40" fill="url(#ground)"/>
  <ellipse cx="600" cy="258" rx="700" ry="30" fill="#0d0520"/>

  <!-- Trees - Left side -->
  <!-- Tree 1 far left -->
  <rect x="18" y="190" width="8" height="80" fill="#0a0515"/>
  <polygon points="22,110 0,200 44,200" fill="#0f0a1e"/>
  <polygon points="22,140 2,205 42,205" fill="#130d22"/>
  <polygon points="22,165 4,208 40,208" fill="#160f25"/>

  <!-- Tree 2 -->
  <rect x="55" y="195" width="7" height="75" fill="#0a0515"/>
  <polygon points="58,120 38,205 78,205" fill="#0f0a1e"/>
  <polygon points="58,148 40,208 76,208" fill="#130d22"/>
  <polygon points="58,170 42,210 74,210" fill="#160f25"/>

  <!-- Tree 3 -->
  <rect x="95" y="188" width="9" height="82" fill="#0a0515"/>
  <polygon points="100,105 75,200 125,200" fill="#0f0a1e"/>
  <polygon points="100,135 78,203 122,203" fill="#130d22"/>
  <polygon points="100,162 80,207 120,207" fill="#160f25"/>

  <!-- Tree 4 small -->
  <rect x="135" y="205" width="6" height="65" fill="#0a0515"/>
  <polygon points="138,135 120,210 156,210" fill="#0f0a1e"/>
  <polygon points="138,158 122,212 154,212" fill="#130d22"/>

  <!-- Tree 5 -->
  <rect x="165" y="192" width="8" height="78" fill="#0a0515"/>
  <polygon points="169,115 148,202 190,202" fill="#0f0a1e"/>
  <polygon points="169,143 150,205 188,205" fill="#130d22"/>
  <polygon points="169,168 152,208 186,208" fill="#160f25"/>

  <!-- Trees - Right side -->
  <!-- Tree R1 -->
  <rect x="1028" y="192" width="8" height="78" fill="#0a0515"/>
  <polygon points="1032,112 1010,202 1054,202" fill="#0f0a1e"/>
  <polygon points="1032,140 1012,205 1052,205" fill="#130d22"/>
  <polygon points="1032,165 1014,208 1050,208" fill="#160f25"/>

  <!-- Tree R2 -->
  <rect x="1068" y="198" width="7" height="72" fill="#0a0515"/>
  <polygon points="1072,122 1052,205 1092,205" fill="#0f0a1e"/>
  <polygon points="1072,148 1054,207 1090,207" fill="#130d22"/>

  <!-- Tree R3 -->
  <rect x="1100" y="188" width="9" height="82" fill="#0a0515"/>
  <polygon points="1105,108 1080,200 1130,200" fill="#0f0a1e"/>
  <polygon points="1105,136 1082,202 1128,202" fill="#130d22"/>
  <polygon points="1105,162 1084,206 1126,206" fill="#160f25"/>

  <!-- Tree R4 small -->
  <rect x="1140" y="202" width="6" height="68" fill="#0a0515"/>
  <polygon points="1143,132 1125,208 1161,208" fill="#0f0a1e"/>
  <polygon points="1143,155 1127,210 1159,210" fill="#130d22"/>

  <!-- Tree R5 -->
  <rect x="1168" y="195" width="7" height="75" fill="#0a0515"/>
  <polygon points="1172,118 1152,202 1192,202" fill="#0f0a1e"/>
  <polygon points="1172,145 1154,205 1190,205" fill="#130d22"/>
  <polygon points="1172,168 1156,208 1188,208" fill="#160f25"/>

  <!-- Purple mist / fog at base -->
  <ellipse cx="200" cy="268" rx="250" ry="18" fill="#4a1a8a" opacity="0.15"/>
  <ellipse cx="1000" cy="268" rx="250" ry="18" fill="#4a1a8a" opacity="0.15"/>
  <ellipse cx="600" cy="270" rx="400" ry="12" fill="#7b2d8b" opacity="0.1"/>

  <!-- Deer silhouette (center-left) -->
  <g transform="translate(520, 228)" fill="#050010">
    <!-- Body -->
    <ellipse cx="20" cy="18" rx="18" ry="10"/>
    <!-- Neck -->
    <rect x="30" y="8" width="5" height="12" rx="2"/>
    <!-- Head -->
    <ellipse cx="35" cy="6" rx="6" ry="5"/>
    <!-- Antlers -->
    <line x1="33" y1="2" x2="28" y2="-8" stroke="#050010" stroke-width="1.5"/>
    <line x1="28" y1="-8" x2="24" y2="-4" stroke="#050010" stroke-width="1"/>
    <line x1="28" y1="-8" x2="26" y2="-12" stroke="#050010" stroke-width="1"/>
    <line x1="37" y1="2" x2="42" y2="-8" stroke="#050010" stroke-width="1.5"/>
    <line x1="42" y1="-8" x2="46" y2="-4" stroke="#050010" stroke-width="1"/>
    <line x1="42" y1="-8" x2="44" y2="-12" stroke="#050010" stroke-width="1"/>
    <!-- Legs -->
    <rect x="8" y="25" width="3" height="14" rx="1"/>
    <rect x="14" y="25" width="3" height="14" rx="1"/>
    <rect x="24" y="25" width="3" height="14" rx="1"/>
    <rect x="30" y="25" width="3" height="14" rx="1"/>
    <!-- Tail -->
    <ellipse cx="2" cy="16" rx="3" ry="4" fill="#0d0520"/>
  </g>

  <!-- Main text: Hi, I'm Aryan -->
  <text x="600" y="148" 
    font-family="Georgia, serif" 
    font-size="52" 
    font-weight="bold" 
    fill="white" 
    text-anchor="middle"
    filter="url(#softglow)"
    letter-spacing="2">Hi, I'm Aryan 👋</text>

  <!-- Subtitle -->
  <text x="600" y="192" 
    font-family="Arial, sans-serif" 
    font-size="19" 
    fill="#c9b8ff" 
    text-anchor="middle"
    letter-spacing="1">A Data Science &amp; Full-Stack Engineer in making</text>

  <!-- Subtle bottom border glow -->
  <rect x="0" y="295" width="1200" height="5" fill="#7b2d8b" opacity="0.6"/>
  <rect x="200" y="294" width="800" height="3" fill="#bf91f3" opacity="0.4"/>

</svg>
