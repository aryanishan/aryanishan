      <circle r="15" fill="#bf91f3" opacity="0.16" filter="url(#glow)">
        <animate attributeName="opacity" values="0.10;0.35;0.10" dur="2.90s" begin="0.70s" repeatCount="indefinite"/>
      </circle>
