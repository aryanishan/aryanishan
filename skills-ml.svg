      <circle r="15" fill="#bf91f3" opacity="0.16" filter="url(#glow)">
        <animate attributeName="opacity" values="0.10;0.35;0.10" dur="2.40s" begin="0.00s" repeatCount="indefinite"/>
      </circle>
      <image href="https://skillicons.dev/icons?i=tensorflow" x="-18.0" y="-18.0" width="36" height="36"/>
    </g>
    <text x="0" y="34" text-anchor="middle" font-family="Verdana, Arial, sans-serif"
      font-size="9.5" fill="#cdd9e5" fill-opacity="0.85">TensorFlow</text>
  </g>
  <g transform="translate(111.0,40)">
